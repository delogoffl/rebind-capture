<!doctype html>
<html lang="en" data-theme="dark" data-accent="indigo">
<head>
  <meta charset="utf-8">
  <!--
    A content security policy tight enough that a compromised dependency would
    have nowhere to go — except there are no dependencies, so this is belt and
    braces for the images the renderer builds from library bytes.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' capture:; img-src 'self' capture: data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' capture:">
  <title>Rebind Capture</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="titlebar">
    <span class="brand">
      <img src="../build/icon.png" alt="" width="22" height="22" onerror="this.hidden=true">
      <b>Rebind Capture</b>
    </span>

    <!-- Beside the brand, not adrift in the middle. A lone pill centred in an
         otherwise empty title bar reads as something that failed to dock; as
         the second item in a left-hand cluster it reads as what it is, which is
         the app telling you what it is currently doing. -->
    <span class="status-pill" id="statusPill" data-phase="ready">
      <span class="dot"></span><span id="statusText">Ready</span>
    </span>

    <span class="tb-spacer"></span>
    <span class="tb-title" id="tbTitle"></span>
    <span class="tb-spacer"></span>

    <div class="wincontrols">
      <button id="winMin" type="button" title="Minimise" aria-label="Minimise">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button id="winMax" type="button" title="Maximise" aria-label="Maximise">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5.5" y="5.5" width="13" height="13" rx="2"/></svg>
      </button>
      <button id="winClose" class="close" type="button" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <nav class="rail">
      <p class="rail-label">Workspace</p>

      <button class="nav" data-view="capture" aria-current="true" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.4-2h7.8l1.4 2h2.2A1.5 1.5 0 0 1 21 8.5v10A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5Z"/><circle cx="12" cy="13" r="3.6"/></svg>
        Capture
      </button>

      <button class="nav" data-view="record" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><circle cx="12" cy="12" r="3.6" fill="currentColor" stroke="none"/></svg>
        Record
      </button>

      <button class="nav" data-view="library" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 21.6 7.6 12 12.4 2.4 7.6Z"/><path d="M2.4 12.4 12 17.2l9.6-4.8M2.4 16.9 12 21.7l9.6-4.8"/></svg>
        Library
        <span class="count" id="navCount">0</span>
      </button>

      <button class="nav" data-view="settings" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-6M4 11V3M12 21v-9M12 8V3M20 21v-4M20 13V3M1.5 15h5M9.5 8h5M17.5 17h5"/></svg>
        Settings
      </button>

      <div class="rail-foot">
        <div class="session-card">
          <p class="eyebrow">Current session</p>
          <p class="name" id="sessionName">No session yet</p>
          <p class="facts" id="sessionFacts">Capture something to start one</p>
          <div class="row">
            <button class="btn quiet" id="newSession" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              New
            </button>
            <button class="btn quiet" id="revealSession" type="button" title="Show the folder on disk">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h9A1.5 1.5 0 0 1 21 10v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18Z"/></svg>
              Folder
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="stage" id="stage"></main>
  </div>

  <footer class="statusbar">
    <span id="statusLibrary">—</span>
    <span class="sep"></span>
    <span id="statusHotkeys">—</span>
    <span class="push"></span>
    <button id="openLibraryFolder" type="button">Open library folder</button>
  </footer>

  <div class="toasts" id="toasts"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
